name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc -b

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: https://placeholder.example.com
          VITE_TASK_API_URL: https://placeholder.example.com
